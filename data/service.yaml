preamble_statement: ''
university:
  statement: I have engaged in a range of service activities, both within UBC and in the broader community.
    At UBC, I serve on the Equity, Diversity, Inclusion and Indigeneity (EDI.I) Committee of the UBC BioProducts
    Institute, as well as on a number of faculty- and department-level committees (mostly focused on teaching
    and course development). Much of my service effort outside university has been within the Canadian
    Operational Research Society (CORS), where I have played several leadership roles in the past 15 years
    (including founding two national special interest groups [Forestry, Analytics], a 4-year term as national
    Treasurer, chairing multiple Forestry and Analytics clusters at national conferences, acting as Guest
    Editor on a special issue of the CORS-managed journal INFOR, leading the local Vancouver CORS member
    section, and participating in launching of new EDI initiative within this organization). I have also
    worked to create an inclusive and diverse environment within my lab—although this is an ongoing effort,
    I have been successful in attracting a highly diverse group of early career researchers to work on
    my team.
