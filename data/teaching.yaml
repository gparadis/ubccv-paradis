course_descriptions:
  - code: FRST 558
    title: Landscape-Level Forest Land Management
    credits: '7'
    contact_pattern: 0-0-0
    description: Preparation of landscape-level sustainable forest management plans that integrate ecological,
      social and economic components.
  - code: FRST 422
    title: Mathematical Modelling in Forest Resource Analysis
    credits: '3'
    contact_pattern: 2-0-3
    description: Modelling techniques used in strategic and tactical forest resources analyses.
  - code: FRST 422 DE
    title: Mathematical Modelling in Forest Resource Analysis
    credits: '3'
    contact_pattern: 0-0-0
    description: Modelling techniques used in strategic and tactical forest resources analyses. Distance
      education course, online (with live weekly office hours via Zoom videoconference).
  - code: FRST 318
    title: Forest and Conservation Economics
    credits: '3'
    contact_pattern: 2-3-0
    description: Practical problem solving of economic issues related to forestry and conservation, touching
      on investment analysis, capital budgeting, non-timber economics, ecosystem services, and forest
      certification.
  - code: FRST 424
    title: Sustainable Forest Management
    credits: '10'
    contact_pattern: 6-2-4
    description: Forest management designs to identify and integrate economic, social, and environmental
      objectives across a forested landscape both strategically and tactically.
  - code: VSP
    title: Sustainable Forest Management
    contact_pattern: 12-0-0
    description: Introduction to sustainable forest management concepts, applied to a British Columbia
      context. Intensive 6-week course offered as part of the Vancouver Summer Program.
