statement: I specialize in operational research, mathematical modelling, forest management planning, and
  forest engineering, integrating academic and real-world insights. My focus includes forest ecosystem
  process modelling, forest resource analysis, forest estate modelling, forest economics, and environmental
  sustainability, notably carbon accounting for forest ecosystems and forest products. A key accomplishment
  is developing FRST 422, a capstone course linking theory with practice, enhancing students' critical
  thinking and problem-solving skills. This course also serves as a precursor to FRST 423. Additionally,
  I am creating a new module in FRST 558 on forest management and resource analysis, leveraging my experience
  as a forester, engineer, and forest estate modelling expert. Both FRST 422 and FRST 558 aim to equip
  students with essential knowledge and technical skills for their future careers as forest professionals.
