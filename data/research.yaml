statement: My research focuses on forest management problems, applying operations research (OR) methods
  to formulate and solve complex decision problems through mathematical optimization. I use a systems
  approach to model interactions between forest ecosystems, industrial supply chains, governments, and
  society. My interests intersect forest science, economics, engineering, data science, computer science,
  and OR. Key research topics include forest estate modeling, cumulative effects modeling, supply chain
  modeling, carbon accounting, and nature-based decarbonization. As Theme Leader, I launched the Natural
  Capital and Biodiversity research theme within the Bradshaw Research Initiative for Minerals and Mining
  (BRIMM), mobilizing government and industry partners for impactful research. I’ve secured substantial
  amounts of “soft” funding from key government agencies and established firm commitments for future funding.
  Additionally, I am negotiating new industry partnerships and have applied for major infrastructure grant
  (CFI JELF) to support advanced research computing equipment for my modeling research program (and development
  of an open innovation hub).
